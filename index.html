<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဝန်ထမ်းနှင့် အခန်း စီမံခန့်ခွဲမှု စနစ်</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Padauk', 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <!-- LOGIN / PASSWORD MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-gray-100 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-gray-800">စကားဝပ် ရိုက်ထည့်ပါ</h3>
                <p class="text-xs text-gray-500 mt-1">စနစ်အသုံးပြုရန် လျှို့ဝှက်နံပါတ် ဖြည့်သွင်းပါ</p>
            </div>
            
            <form onsubmit="verifyPassword(event)" class="space-y-3">
                <input type="password" id="password-input" placeholder="Password ရိုက်ပါ" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-center text-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md transition">
                    ဝင်ရောက်မည်
                </button>
            </form>
            <p id="error-msg" class="text-xs text-red-500 font-bold hidden">စကားဝပ် အမှားဖြစ်နေပါသည်။ ထပ်မံကြိုးစားပါ။</p>
        </div>
    </div>

    <!-- MAIN APP CONTENT (Hidden until logged in) -->
    <div id="app-content" class="min-h-screen flex flex-col hidden">
        <!-- Header -->
        <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-address-card text-2xl"></i>
                    <h1 class="text-lg font-bold">ဝန်ထမ်း အချက်အလက် စီမံခန့်ခွဲမှုစနစ်</h1>
                </div>
                <div class="flex items-center gap-2">
                    <span id="sync-status" class="text-xs bg-emerald-800 px-2 py-1 rounded text-emerald-200">Google Sheet Sync ✔</span>
                    <button onclick="loadData()" class="bg-emerald-800 hover:bg-emerald-900 p-2 rounded-lg text-white" title="ဒေတာပြန်ဆွဲမည်">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button onclick="logout()" class="bg-red-700 hover:bg-red-800 p-2 rounded-lg text-white text-xs ml-2" title="ထွက်မည်">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- LEFT: FORM LAYOUT -->
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-md border border-gray-200 p-5 flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-address-card text-emerald-600"></i>
                            <span>ဝန်ထမ်း အချက်အလက် ကြည့်ရှုရန်</span>
                        </h2>

                        <div class="border-2 border-gray-800 rounded-xl p-4 bg-gray-50 mb-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                                
                                <!-- Profile Image Slot -->
                                <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-3 bg-white h-56 relative group">
                                    <img id="profile-preview" src="https://via.placeholder.com/150" alt="Photo" class="w-32 h-32 rounded-full object-cover border-2 border-emerald-500 mb-2 shadow-sm">
                                    <input type="file" id="photo-input" accept="image/*"
